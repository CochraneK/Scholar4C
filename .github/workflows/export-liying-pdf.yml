name: Export Li Ying PDF

on:
  workflow_dispatch:
  push:
    paths:
      - 'li_ying/report.html'
      - '.github/workflows/export-liying-pdf.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CJK fonts and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils

      - name: Prepare print HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('li_ying/report.html')
          dst = Path('li_ying/report_print.html')
          html = src.read_text(encoding='utf-8')
          css = r'''
          <style id="pdf-print-overrides">
          @page { size: A4; margin: 10mm 9mm 12mm; }
          @media print {
            html, body { background: #fff !important; }
            body {
              font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif !important;
              -webkit-print-color-adjust: exact !important;
              print-color-adjust: exact !important;
            }

            /* Web-only controls do not belong in the report. */
            .nav, .filters { display: none !important; }
            .container { max-width: none !important; padding: 6px 0 !important; }
            .header { padding: 26px 18px !important; break-after: avoid-page; page-break-after: avoid; }

            /* Major chapters start cleanly on a new page. */
            #insights, #timeline, #papers, #plain, #persona, #profile, #method {
              break-before: page;
              page-break-before: always;
            }

            /* Do NOT lock whole chapters/tables to one page: that creates large blank areas. */
            .section, .pg, .tl-phase, table {
              break-inside: auto !important;
              page-break-inside: auto !important;
            }
            .section {
              box-shadow: none !important;
              margin-bottom: 14px !important;
            }
            .tl-phase { overflow: visible !important; }

            /* Keep small semantic units intact. */
            .stats-grid, .row, .chart-box,
            .stat-card, .insight, .pc, .pv-ev, .pv-inf, .node,
            .tl-core, .tl-step, .tl-banner, .tl-oneliner, .tl-ev,
            .pv-warn, .pv-hero, .pf-works, .pf-src-box,
            pre, blockquote {
              break-inside: avoid-page;
              page-break-inside: avoid;
            }

            /* Keep headings with what follows. */
            h1, h2, h3, h4,
            .section > h2, .pg-title, .tl-phead, .tl-pmeta,
            .pc-head, .pv-inf-head, .pf-works-t, .pv-ev-name {
              break-after: avoid-page;
              page-break-after: avoid;
            }

            /* Long tables may continue, but rows should not be torn in half. */
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
            tr, th, td {
              break-inside: avoid-page;
              page-break-inside: avoid;
            }

            /* Avoid orphaned single lines at page tops/bottoms. */
            p, li { orphans: 3; widows: 3; }

            /* Charts should stay compact and printable. */
            .chart-box { height: 285px !important; }
            canvas { max-width: 100% !important; }

            .pc:hover {
              transform: none !important;
              box-shadow: 0 1px 3px rgba(0,0,0,.05) !important;
            }
            a { text-decoration: none !important; }
          }
          </style>
          '''
          if '</head>' in html:
              html = html.replace('</head>', css + '</head>', 1)
          else:
              html = css + html
          dst.write_text(html, encoding='utf-8')
          PY

      - name: Render PDF with headless Chrome
        run: |
          python3 -m http.server 8000 >/tmp/scholar4c-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "Using browser: $CHROME"
          "$CHROME" \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --disable-dev-shm-usage \
            --no-pdf-header-footer \
            --virtual-time-budget=12000 \
            --print-to-pdf="$(pwd)/li_ying/report.pdf" \
            http://127.0.0.1:8000/li_ying/report_print.html
          test -s li_ying/report.pdf
          pdfinfo li_ying/report.pdf | sed -n '1,20p'
          rm -f li_ying/report_print.html

      - name: Commit generated PDF
        run: |
          if git diff --quiet -- li_ying/report.pdf && git ls-files --error-unmatch li_ying/report.pdf >/dev/null 2>&1; then
            echo "PDF unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add li_ying/report.pdf
          git commit -m "docs: export Li Ying report as PDF"
          git push
